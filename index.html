<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153d38">
<meta name="description" content="An offline focus timer with a private session journal.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23153d38'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23beefd1' stroke-width='8'/%3E%3Cpath d='M50 31v20l13 8' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Focus Flow</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--ink:#173a35;--dim:#50665e;--line:#cbd8cc;--paper:#fffef8}
body{margin:0;background:#f1f4eb;color:var(--ink);font:1rem/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
main{max-width:54rem;margin:auto;padding:1.25rem clamp(1rem,4vw,2rem) 4rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.3rem}
h1,h2,p{margin:0}h1{font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:-.06em}h2,summary{font-size:1.2rem;font-weight:700}
small,.dim{color:var(--dim)}
.card,details{background:var(--paper);border:1px solid var(--line);border-radius:1.2rem;padding:1.2rem;margin-bottom:1rem}
.timer{background:#153d38;color:#fffef8;text-align:center;padding:2rem 1rem}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:750}
#clock{font-size:clamp(3.5rem,15vw,7.8rem);line-height:1.25;font-weight:650;letter-spacing:-.065em;font-variant-numeric:tabular-nums}
#hint{min-height:1.5em;color:#c8e3d5}
.actions,.fields,.summary{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap}
.actions{justify-content:center;margin:1.1rem 0}
button,input,textarea{font:inherit}
button{min-height:44px;padding:.5rem 1.1rem;border:1px solid var(--line);border-radius:2rem;color:var(--ink);background:var(--paper);font-weight:650;cursor:pointer}
.timer button{background:transparent;color:white;border-color:#77958c}
.timer #toggle{background:#beefd1;color:#153d38;border-color:#beefd1;min-width:7rem}
:focus-visible{outline:3px solid #db9125;outline-offset:3px}
label{display:block;font-weight:650}
textarea,input[type=number]{width:100%;border:1px solid #9db3a6;border-radius:.65rem;background:white;padding:.65rem;color:var(--ink)}
textarea{display:block;resize:vertical;min-height:4.5rem;margin:.5rem 0}
summary{cursor:pointer}
.fields{margin:.85rem 0}.fields label{flex:1;min-width:7rem}.fields input{display:block;margin-top:.25rem}
.check{display:flex;align-items:center;gap:.5rem;margin:.8rem 0}.check input{width:1.2rem;height:1.2rem}
.summary{justify-content:space-between;align-items:baseline}.summary strong{font-size:1.4rem}
#week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.2rem;margin:1rem 0 .5rem;text-align:center}
.day{padding:.45rem 0;background:#edf1e9;border-radius:.55rem;font-size:.77rem}
.day b{display:block;font-size:.95rem}.day.done{background:#beefd1}.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
ul{list-style:none;margin:0;padding:0}li{border-top:1px solid var(--line);margin-top:.85rem;padding-top:.85rem}
.entry{white-space:pre-wrap;overflow-wrap:anywhere}
#notice:not(:empty){margin-bottom:1rem;padding:.6rem;background:#fff0ce;border-radius:.5rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><div><p class="kicker">Personal workspace</p><h1>Focus Flow</h1></div><button id="install" hidden>Install app</button></header>
<p id="notice" role="status"></p>
<section class="card timer" aria-label="Session timer">
<h2 class="kicker" id="phase">Focus session</h2>
<div id="clock" role="timer" aria-live="off">25:00</div>
<p id="hint" role="status"></p>
<div class="actions"><button id="toggle">Start focus</button><button id="reset">Reset</button></div>
<button id="switch">Switch to break</button>
</section>
<section class="card">
<label for="note">What are you working on?</label>
<textarea id="note" maxlength="2000" placeholder="One task to give your attention to…"></textarea>
<small>Your note is saved with the next completed focus session.</small>
</section>
<details>
<summary>Timer settings</summary>
<form id="settings">
<div class="fields">
<label>Focus minutes<input id="work" type="number" min="1" max="180" step="1" required></label>
<label>Break minutes<input id="rest" type="number" min="1" max="60" step="1" required></label>
</div>
<label class="check"><input type="checkbox" id="sound">Gentle completion chime</label>
<button>Save settings</button>
<small>New lengths apply to fresh timers.</small>
</form>
</details>
<section class="card">
<div class="summary"><h2>Today</h2><strong id="total">0 min</strong></div>
<p id="count" class="dim"></p>
<div id="week" aria-label="Focus minutes for the last seven days"></div>
<p id="streak"></p>
</section>
<section class="card"><h2>Session journal</h2><small>Completed focus sessions · newest first · stored on this device</small><ul id="journal"></ul></section>
<small id="offline" role="status"></small>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='focus-flow-v1';
const fresh=()=>({work:25,rest:5,sound:true,phase:'work',remaining:1500000,end:0,started:false,span:0,note:'',entries:[]});
let s=fresh(), audio=null, wake=null, asking=false, installEvent=null, shownDay='', shownClock='';
function toTimestamp(v){return (typeof v==='number' && Number.isFinite(v))?v:+new Date(v)}
try{
  const saved=JSON.parse(localStorage.getItem(KEY));
  if(saved && ['work','rest'].includes(saved.phase) && Array.isArray(saved.entries)
    && Number.isFinite(saved.remaining) && Number.isFinite(saved.end) && Number.isFinite(saved.span||0)){
    s={...s,...saved};
    if(!Number.isFinite(s.span))s.span=0;
    s.entries=saved.entries.map(e=>({
      at:toTimestamp(e.at),
      minutes:Number.isFinite(e.minutes)?e.minutes:Math.max(1,Math.round(Number(e.minutes)||0)),
      note:String(e.note||'')
    }));
  }
}catch(e){$('notice').textContent='Local storage could not be read.'}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(s))}
  catch(e){$('notice').textContent='Storage unavailable or full. Changes may not survive closing the app.'}
}
function day(d){
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
}
function offsetDay(n){
  const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d;
}
function duration(){return s[s.phase]*60000}
function idle(){s.end=0;s.started=false;s.span=0;s.remaining=duration()}
function unlockAudio(){
  if(!s.sound)return;
  try{
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!audio && Context)audio=new Context();
    if(audio && audio.state!=='running')audio.resume().catch(()=>{});
  }catch(e){}
}
function chime(){
  if(!s.sound || !audio || audio.state!=='running')return;
  [523.25,659.25].forEach((freq,i)=>{
    const t=audio.currentTime+i*.22,o=audio.createOscillator(),g=audio.createGain();
    o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.075,t+.03);
    g.gain.exponentialRampToValueAtTime(.0001,t+.8);
    o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.82);
    o.onended=()=>{o.disconnect();g.disconnect()};
  });
}
async function syncWake(){
  if(!s.end || document.hidden){
    if(wake){const old=wake;wake=null;try{await old.release()}catch(e){}}
    return;
  }
  if(!navigator.wakeLock || asking || wake)return;
  asking=true;
  try{
    const lock=await navigator.wakeLock.request('screen');
    if(!s.end || document.hidden){await lock.release()}
    else{
      wake=lock;
      lock.addEventListener('release',()=>{
        if(wake===lock){
          wake=null;
          if(s.end && !document.hidden && navigator.wakeLock)syncWake();
        }
      });
    }
  }catch(e){}finally{asking=false}
}
function renderStats(){
  const totals=new Map();
  for(const e of s.entries){
    const k=day(new Date(e.at)),v=totals.get(k)||{minutes:0,count:0};
    v.minutes+=e.minutes;v.count++;totals.set(k,v);
  }
  shownDay=day(new Date());
  const today=totals.get(shownDay)||{minutes:0,count:0};
  $('total').textContent=today.minutes+' min';
  $('count').textContent=today.count+' completed focus session'+(today.count===1?'':'s');
  $('week').replaceChildren();
  for(let i=-6;i<=0;i++){
    const d=offsetDay(i),m=totals.get(day(d))?.minutes||0;
    const box=document.createElement('div'),b=document.createElement('b');
    box.className='day'+(m?' done':'')+(i===0?' today':'');
    box.title=d.toLocaleDateString()+' — '+m+' focus minutes';
    box.append(d.toLocaleDateString(undefined,{weekday:'short'}),b);
    b.textContent=m+'m';$('week').append(box);
  }
  let n=0,i=today.count?0:-1;
  while(totals.has(day(offsetDay(i--))))n++;
  $('streak').textContent=n+'-day focus streak';
}
function renderJournal(){
  const list=$('journal');list.replaceChildren();
  for(const e of [...s.entries].reverse()){
    const li=document.createElement('li'),stamp=document.createElement('small'),entry=document.createElement('p');
    stamp.textContent=new Date(e.at).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})+' · '+e.minutes+' min';
    entry.className='entry';entry.textContent=e.note||'Focus session';
    li.append(stamp,entry);list.append(li);
  }
  if(!s.entries.length){const li=document.createElement('li');li.textContent='Your first focus session will appear here.';list.append(li)}
}
function controls(){
  const work=s.phase==='work',name=work?'focus':'break';
  $('phase').textContent=work?'Focus session':'Rest interval';
  $('hint').textContent=s.end?(work?'One task at a time.':'Take a breath.'):(s.started?'Paused.':'Ready when you are.');
  $('toggle').textContent=s.end?'Pause':s.started?'Resume':'Start '+name;
  $('switch').textContent='Switch to '+(work?'break':'focus');
  shownClock='';syncWake();
}
function complete(){
  const work=s.phase==='work',at=Date.now();
  if(work){
    const mins=Math.max(1,Math.round(s.span/60000));
    s.entries.push({at,minutes:mins,note:s.note.trim()});
    s.note='';$('note').value='';
  }
  s.phase=work?'rest':'work';idle();save();controls();renderStats();renderJournal();
  $('hint').textContent=work?'Focus complete. Your break is ready.':'Break complete. Ready to focus?';
  tick();chime();
}
function tick(){
  if(s.end && Date.now()>=s.end)complete();
  const sec=Math.ceil(Math.max(0,s.end?s.end-Date.now():s.remaining)/1000);
  const text=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  if(text!==shownClock){
    shownClock=text;$('clock').textContent=text;
    document.title=(s.end||s.started?text+' · ':'')+'Focus Flow';
  }
  if(day(new Date())!==shownDay)renderStats();
}
$('toggle').onclick=()=>{
  if(s.end && Date.now()>=s.end){tick();return}
  unlockAudio();
  if(s.end){s.remaining=Math.max(1,s.end-Date.now());s.end=0}
  else{if(!s.started){s.span=s.remaining;s.started=true}s.end=Date.now()+s.remaining}
  save();controls();tick();
};
function discard(change){
  tick();
  if(s.started && !confirm('Discard this unfinished timer? Your draft note will be kept.'))return;
  if(change)s.phase=s.phase==='work'?'rest':'work';
  idle();save();controls();tick();
}
$('reset').onclick=()=>discard(false);
$('switch').onclick=()=>discard(true);
$('note').value=s.note;
$('note').oninput=e=>{s.note=e.target.value;save()};
$('work').value=s.work;$('rest').value=s.rest;$('sound').checked=s.sound;
$('settings').onsubmit=e=>{
  e.preventDefault();tick();
  s.work=$('work').valueAsNumber;s.rest=$('rest').valueAsNumber;s.sound=$('sound').checked;
  if(!s.started)idle();
  unlockAudio();$('notice').textContent='Settings saved.';save();controls();tick();
  setTimeout(()=>{$('notice').textContent=''},3000);
};
document.addEventListener('visibilitychange',()=>{tick();syncWake()});
window.addEventListener('pageshow',()=>{tick();syncWake()});
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();installEvent=e;$('install').hidden=false;
});
$('install').onclick=async()=>{
  const e=installEvent;installEvent=null;$('install').hidden=true;
  if(e){await e.prompt()}
};
window.addEventListener('appinstalled',()=>{installEvent=null;$('install').hidden=true});
controls();renderStats();renderJournal();tick();setInterval(tick,250);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready)
    .then(()=>{$('offline').textContent='Offline ready · private to this browser'})
    .catch(()=>{$('offline').textContent='Offline setup unavailable. Serve all three files together over HTTPS or localhost.'});
}else $('offline').textContent='For offline installation, open this app over HTTPS or localhost in a supported browser.';
</script>
</body>
</html>
